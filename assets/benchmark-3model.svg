<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 860 336"><title>Median lines of code per arm across three models</title><text x="20" y="26" fill="#8b949e" font-size="15" font-weight="600">Median lines of code. 10 runs per cell. Lower is leaner.</text><text x="20" y="45" fill="#8b949e" font-size="12" opacity=".85">Ponytail writes 80-94% less code, costs 42-75% less, and runs 3-6x faster than a no-skill agent.</text><rect width="12" height="12" x="20" y="58" fill="#8b949e" rx="2"/><text x="38" y="69" fill="#8b949e" font-size="13">baseline (no skill)</text><rect width="12" height="12" x="190" y="58" fill="#d9822b" rx="2"/><text x="208" y="69" fill="#8b949e" font-size="13">caveman</text><rect width="12" height="12" x="300" y="58" fill="#2da44e" rx="2"/><text x="318" y="69" fill="#8b949e" font-size="13">ponytail</text><text x="112" y="119" fill="#8b949e" font-size="13" font-weight="600" text-anchor="end">Haiku</text><rect width="508" height="14" x="120" y="92" fill="#8b949e" rx="2"/><text x="634" y="103" fill="#8b949e" font-size="11">518</text><rect width="114" height="14" x="120" y="110" fill="#d9822b" rx="2"/><text x="240" y="121" fill="#d9822b" font-size="11">116</text><rect width="38" height="14" x="120" y="128" fill="#2da44e" rx="2"/><text x="164" y="139" fill="#2da44e" font-size="11" font-weight="600">39</text><text x="112" y="193" fill="#8b949e" font-size="13" font-weight="600" text-anchor="end">Sonnet</text><rect width="680" height="14" x="120" y="166" fill="#8b949e" rx="2"/><text x="806" y="177" fill="#8b949e" font-size="11">693</text><rect width="118" height="14" x="120" y="184" fill="#d9822b" rx="2"/><text x="244" y="195" fill="#d9822b" font-size="11">120</text><rect width="43" height="14" x="120" y="202" fill="#2da44e" rx="2"/><text x="169" y="213" fill="#2da44e" font-size="11" font-weight="600">44</text><text x="112" y="267" fill="#8b949e" font-size="13" font-weight="600" text-anchor="end">Opus</text><rect width="251" height="14" x="120" y="240" fill="#8b949e" rx="2"/><text x="377" y="251" fill="#8b949e" font-size="11">256</text><rect width="66" height="14" x="120" y="258" fill="#d9822b" rx="2"/><text x="192" y="269" fill="#d9822b" font-size="11">67</text><rect width="50" height="14" x="120" y="276" fill="#2da44e" rx="2"/><text x="176" y="287" fill="#2da44e" font-size="11" font-weight="600">51</text><text x="120" y="324" fill="#8b949e" font-size="11" opacity=".8">Median of 10 runs/cell, default temperature. 5 tasks (email, debounce, CSV sum, countdown, rate-limit), same model per group. Reproduce: npx promptfoo eval -c benchmarks/promptfooconfig.yaml</text></svg>