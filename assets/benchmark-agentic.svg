<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" viewBox="0 0 860 488"><title>Each arm vs the no-skill baseline across every metric, plus safety, Claude Code on Haiku 4.5</title><text x="430" y="24" fill="#8b949e" font-size="15" font-weight="600" text-anchor="middle">Every metric vs the no-skill baseline (Claude Code, Haiku 4.5, 12 tasks)</text><rect width="12" height="12" x="212" y="38" fill="#8b949e" rx="2"/><text x="229" y="48" fill="#8b949e" font-size="12">baseline</text><rect width="12" height="12" x="300" y="38" fill="#d9822b" rx="2"/><text x="317" y="48" fill="#8b949e" font-size="12">caveman</text><rect width="12" height="12" x="392" y="38" fill="#2da44e" rx="2"/><text x="409" y="48" fill="#8b949e" font-size="12">ponytail</text><rect width="12" height="12" x="478" y="38" fill="#8957e5" rx="2"/><text x="495" y="48" fill="#8b949e" font-size="12">yagni-oneliner</text><text x="32" y="248" fill="#8b949e" font-size="12" text-anchor="middle" transform="rotate(-90 32 248)">% of baseline (lower is leaner)</text><line x1="85" x2="815" y1="360" y2="360" stroke="#8b949e" stroke-opacity=".55"/><line x1="85" x2="815" y1="305" y2="305" stroke="#8b949e" stroke-opacity=".16"/><line x1="85" x2="815" y1="250" y2="250" stroke="#8b949e" stroke-opacity=".16"/><line x1="85" x2="815" y1="195" y2="195" stroke="#8b949e" stroke-opacity=".16"/><line x1="85" x2="815" y1="140" y2="140" stroke="#8b949e" stroke-dasharray="4 4" stroke-opacity=".45"/><text x="78" y="364" fill="#8b949e" font-size="11" text-anchor="end">0%</text><text x="78" y="309" fill="#8b949e" font-size="11" text-anchor="end">25%</text><text x="78" y="254" fill="#8b949e" font-size="11" text-anchor="end">50%</text><text x="78" y="199" fill="#8b949e" font-size="11" text-anchor="end">75%</text><text x="78" y="144" fill="#8b949e" font-size="11" text-anchor="end">100%</text><rect width="30" height="220" x="108" y="140" fill="#8b949e" rx="2"/><text x="123" y="135" fill="#8b949e" font-size="10" text-anchor="middle">100%</text><rect width="30" height="176" x="146" y="184" fill="#d9822b" rx="2"/><text x="161" y="179" fill="#d9822b" font-size="10" text-anchor="middle">80%</text><rect width="30" height="101" x="184" y="259" fill="#2da44e" rx="2"/><text x="199" y="254" fill="#2da44e" font-size="10" font-weight="600" text-anchor="middle">46%</text><rect width="30" height="147" x="222" y="213" fill="#8957e5" rx="2"/><text x="237" y="208" fill="#8957e5" font-size="10" text-anchor="middle">67%</text><text x="180" y="380" fill="#8b949e" font-size="13" text-anchor="middle">LOC</text><text x="180" y="395" fill="#8b949e" font-size="10" opacity=".8" text-anchor="middle">base 191</text><rect width="30" height="220" x="288" y="140" fill="#8b949e" rx="2"/><text x="303" y="135" fill="#8b949e" font-size="10" text-anchor="middle">100%</text><rect width="30" height="235" x="326" y="125" fill="#d9822b" rx="2"/><text x="341" y="120" fill="#d9822b" font-size="10" text-anchor="middle">107%</text><rect width="30" height="172" x="364" y="188" fill="#2da44e" rx="2"/><text x="379" y="183" fill="#2da44e" font-size="10" font-weight="600" text-anchor="middle">78%</text><rect width="30" height="189" x="402" y="171" fill="#8957e5" rx="2"/><text x="417" y="166" fill="#8957e5" font-size="10" text-anchor="middle">86%</text><text x="360" y="380" fill="#8b949e" font-size="13" text-anchor="middle">tokens</text><text x="360" y="395" fill="#8b949e" font-size="10" opacity=".8" text-anchor="middle">base 349k</text><rect width="30" height="220" x="468" y="140" fill="#8b949e" rx="2"/><text x="483" y="135" fill="#8b949e" font-size="10" text-anchor="middle">100%</text><rect width="30" height="224" x="506" y="136" fill="#d9822b" rx="2"/><text x="521" y="131" fill="#d9822b" font-size="10" text-anchor="middle">102%</text><rect width="30" height="176" x="544" y="184" fill="#2da44e" rx="2"/><text x="559" y="179" fill="#2da44e" font-size="10" font-weight="600" text-anchor="middle">80%</text><rect width="30" height="172" x="582" y="188" fill="#8957e5" rx="2"/><text x="597" y="183" fill="#8957e5" font-size="10" text-anchor="middle">78%</text><text x="540" y="380" fill="#8b949e" font-size="13" text-anchor="middle">cost</text><text x="540" y="395" fill="#8b949e" font-size="10" opacity=".8" text-anchor="middle">base $0.10</text><rect width="30" height="220" x="648" y="140" fill="#8b949e" rx="2"/><text x="663" y="135" fill="#8b949e" font-size="10" text-anchor="middle">100%</text><rect width="30" height="224" x="686" y="136" fill="#d9822b" rx="2"/><text x="701" y="131" fill="#d9822b" font-size="10" text-anchor="middle">102%</text><rect width="30" height="161" x="724" y="199" fill="#2da44e" rx="2"/><text x="739" y="194" fill="#2da44e" font-size="10" font-weight="600" text-anchor="middle">73%</text><rect width="30" height="154" x="762" y="206" fill="#8957e5" rx="2"/><text x="777" y="201" fill="#8957e5" font-size="10" text-anchor="middle">70%</text><text x="720" y="380" fill="#8b949e" font-size="13" text-anchor="middle">time</text><text x="720" y="395" fill="#8b949e" font-size="10" opacity=".8" text-anchor="middle">base 69s</text><text x="20" y="418" fill="#8b949e" font-size="11" opacity=".8">Each bar = that arm&apos;s mean as a % of the no-skill baseline (the gray 100% bars). Lower is leaner / cheaper / faster; caveman rises above 100% on tokens, cost and time. n=4.</text><line x1="20" x2="815" y1="438" y2="438" stroke="#8b949e" stroke-opacity=".25"/><text x="20" y="460" fill="#8b949e" font-size="11" opacity=".9">Safety, separate 6-task adversarial tier (path-traversal, SQLi, token forgery, malformed input, rate-limit). Higher is safer:</text><text x="90" y="478" fill="#8b949e" font-size="12">baseline 100%</text><text x="230" y="478" fill="#d9822b" font-size="12">caveman 100%</text><text x="370" y="478" fill="#2da44e" font-size="12" font-weight="600">ponytail 100%</text><text x="510" y="478" fill="#8957e5" font-size="12">yagni-oneliner <tspan fill="#cf222e" font-weight="600">95%</tspan> (dropped a guard once)</text></svg>